<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotels - My Travel Switch</title>


    
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">

     <!-- Fonts  -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.1.0/css/all.min.css">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Common header automatically loaded -->
    <div id="header"></div>






       

<!-- HOTEL HERO SECTION -->
<section class="relative w-full overflow-hidden bg-black">

    <!-- MOBILE HERO IMAGE -->
    <img
        src="/images/hotel/hotel-mobail.png"
        alt="My Travel Switch Hotel Booking"
        class="block h-auto w-full md:hidden min-h-[270px]"
    >

    <!-- TABLET & DESKTOP HERO IMAGE -->
    <img
        src="/images/hotel/hotel-pc.png"
        alt="My Travel Switch Hotel Booking"
        class="hidden h-auto w-full md:block min-h-[545px]"
    >

    <!-- GRADIENT OVERLAY -->
    <div class="absolute inset-0 bg-gradient-to-r from-black/40 via-black/10 to-transparent"></div>

    <!-- HERO CONTENT -->
    <div class="absolute inset-0 z-10 flex items-center">

        <div class="flex w-full items-center justify-between gap-1 px-2 sm:gap-4 sm:px-6 md:px-8 lg:px-12 xl:px-16">

            <!-- LEFT CONTENT -->
            <div class="w-[51%] text-white sm:w-[55%] md:w-[55%]">

                <!-- TAGLINE -->
                <div class="mb-1.5 flex items-center gap-1.5 sm:mb-4 sm:gap-2">
                    <span class="h-px w-4 bg-sky-400 sm:w-9"></span>

                    <span class="text-[6px] font-semibold uppercase tracking-[0.15em] text-sky-300 sm:text-xs sm:tracking-[0.2em]">
                        Hotel Booking
                    </span>
                </div>

                <!-- MAIN HEADING -->
                <h1 class="playfair-bold text-[19px] leading-tight sm:text-3xl md:text-4xl lg:text-5xl xl:text-6xl">

                    Your Perfect Stay,

                    <span class="mt-0.5 block text-sky-400 sm:mt-1">
                        Your Way.
                    </span>

                </h1>

                <!-- SMALL DETAIL -->
                <div class="mt-2 flex w-fit items-center gap-1.5 rounded-md bg-black/40 p-1.5 sm:mt-6 sm:gap-2 sm:p-4">

                    <i class="fa-solid fa-hotel text-[9px] text-sky-400 sm:text-base"></i>

                    <span class="text-[6px] uppercase tracking-wider text-white/80 sm:text-xs sm:tracking-widest">
                        Find Your Perfect Stay
                    </span>

                </div>

            </div>


            <!-- RIGHT SIDE HOTEL ENQUIRY FORM -->
            <div class="w-[47%] max-w-md shrink-0 sm:w-[40%] lg:w-[35%]">

                <div class="rounded-md border border-white bg-white/10 p-1.5 shadow-2xl backdrop-blur-xl sm:rounded-2xl sm:p-4 lg:p-5">

                    <!-- FORM HEADING -->
                    <div class="mb-1 sm:mb-4">

                        <h3 class="playfair-bold text-[9px] text-white sm:text-lg md:text-2xl">

                            <i class="fa-solid fa-hotel mr-0.5 text-[9px] text-amber-500 sm:mr-1 sm:text-2xl"></i>

                            Hotel Enquiry

                        </h3>

                        <p class="mt-1 hidden text-sm text-gray-200 sm:block">
                            Share your stay details to get the best hotel options.
                        </p>

                    </div>


                    <!-- HOTEL BOOKING FORM -->
                    <form
                        id="hotelEnquiryForm"
                        class="w-full space-y-1.5 sm:space-y-3"
                        autocomplete="on"
                    >

                        <!-- NAME + MOBILE -->
                        <div class="grid grid-cols-2 gap-1.5 sm:gap-3">

                            <!-- NAME -->
                            <div class="min-w-0">

                                <label for="hotelName"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                    <i class="fa-solid fa-user mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Name <span class="text-red-300">*</span>

                                </label>

                                <input
                                    type="text"
                                    id="hotelName"
                                    name="name"
                                    placeholder="Your name"
                                    required
                                    minlength="2"
                                    autocomplete="name"
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1.5 py-1.5 text-[9px] text-white outline-none placeholder:text-white/50 focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >

                            </div>


                            <!-- MOBILE -->
                            <div class="min-w-0">

                                <label for="hotelMobile"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                    <i class="fa-solid fa-phone mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Mobile <span class="text-red-300">*</span>

                                </label>

                                <input
                                    type="tel"
                                    id="hotelMobile"
                                    name="mobile"
                                    placeholder="10-digit number"
                                    required
                                    inputmode="numeric"
                                    pattern="[6-9][0-9]{9}"
                                    maxlength="10"
                                    minlength="10"
                                    autocomplete="tel-national"
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1.5 py-1.5 text-[9px] text-white outline-none placeholder:text-white/50 focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >

                            </div>

                        </div>


                        <!-- DESTINATION -->
                        <div class="min-w-0">

                            <label for="hotelDestination"
                                class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                <i class="fa-solid fa-location-dot mr-0.5 text-sky-300 sm:mr-1"></i>
                                Destination / Hotel / Landmark
                                <span class="text-red-300">*</span>

                            </label>

                            <input
                                type="text"
                                id="hotelDestination"
                                name="destination"
                                placeholder="Where do you want to stay?"
                                required
                                class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-2 py-1.5 text-[9px] text-white outline-none placeholder:text-white/50 focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                            >

                        </div>


                        <!-- CHECK-IN + CHECK-OUT -->
                        <div class="grid grid-cols-2 gap-1.5 sm:gap-3">

                            <!-- CHECK-IN -->
                            <div class="min-w-0">

                                <label for="hotelCheckIn"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                    <i class="fa-solid fa-calendar-check mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Check-in <span class="text-red-300">*</span>

                                </label>

                                <input
                                    type="date"
                                    id="hotelCheckIn"
                                    name="checkIn"
                                    required
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1 py-1.5 text-[8px] text-white outline-none [color-scheme:dark] focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >

                            </div>


                            <!-- CHECK-OUT -->
                            <div class="min-w-0">

                                <label for="hotelCheckOut"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                    <i class="fa-solid fa-calendar-days mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Check-out <span class="text-red-300">*</span>

                                </label>

                                <input
                                    type="date"
                                    id="hotelCheckOut"
                                    name="checkOut"
                                    required
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1 py-1.5 text-[8px] text-white outline-none [color-scheme:dark] focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >

                            </div>

                        </div>


                        <!-- ADULTS + CHILDREN + ROOMS -->
                        <div class="grid grid-cols-3 gap-1.5 sm:gap-3">

                            <!-- ADULTS -->
                            <div class="min-w-0">

                                <label class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                    <i class="fa-solid fa-user-group text-sky-300"></i>
                                    Adults <span class="text-red-300">*</span>

                                </label>

                                <div class="flex items-center justify-between gap-0.5 rounded-md border border-white/20 bg-white/10 p-0.5 sm:gap-1 sm:rounded-lg sm:p-1">

                                    <button
                                        type="button"
                                        id="hotelAdultsMinus"
                                        aria-label="Decrease adults"
                                        class="flex size-5 shrink-0 items-center justify-center rounded bg-white/10 text-[8px] text-white hover:bg-sky-500 sm:size-8 sm:text-xs"
                                    >
                                        <i class="fa-solid fa-minus"></i>
                                    </button>

                                    <input
                                        type="number"
                                        id="hotelAdults"
                                        name="adults"
                                        value="1"
                                        min="1"
                                        max="20"
                                        required
                                        readonly
                                        class="w-full min-w-0 bg-transparent text-center text-[9px] font-semibold text-white outline-none sm:text-sm"
                                    >

                                    <button
                                        type="button"
                                        id="hotelAdultsPlus"
                                        aria-label="Increase adults"
                                        class="flex size-5 shrink-0 items-center justify-center rounded bg-white/10 text-[8px] text-white hover:bg-sky-500 sm:size-8 sm:text-xs"
                                    >
                                        <i class="fa-solid fa-plus"></i>
                                    </button>

                                </div>

                            </div>


                            <!-- CHILDREN -->
                            <div class="min-w-0">

                                <label class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                    <i class="fa-solid fa-child text-sky-300"></i>
                                    Children <span class="text-red-300">*</span>

                                </label>

                                <div class="flex items-center justify-between gap-0.5 rounded-md border border-white/20 bg-white/10 p-0.5 sm:gap-1 sm:rounded-lg sm:p-1">

                                    <button
                                        type="button"
                                        id="hotelChildrenMinus"
                                        aria-label="Decrease children"
                                        class="flex size-5 shrink-0 items-center justify-center rounded bg-white/10 text-[8px] text-white hover:bg-sky-500 sm:size-8 sm:text-xs"
                                    >
                                        <i class="fa-solid fa-minus"></i>
                                    </button>

                                    <input
                                        type="number"
                                        id="hotelChildren"
                                        name="children"
                                        value="0"
                                        min="0"
                                        max="20"
                                        required
                                        readonly
                                        class="w-full min-w-0 bg-transparent text-center text-[9px] font-semibold text-white outline-none sm:text-sm"
                                    >

                                    <button
                                        type="button"
                                        id="hotelChildrenPlus"
                                        aria-label="Increase children"
                                        class="flex size-5 shrink-0 items-center justify-center rounded bg-white/10 text-[8px] text-white hover:bg-sky-500 sm:size-8 sm:text-xs"
                                    >
                                        <i class="fa-solid fa-plus"></i>
                                    </button>

                                </div>

                            </div>


                            <!-- ROOMS -->
                            <div class="min-w-0">

                                <label class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">

                                    <i class="fa-solid fa-bed text-sky-300"></i>
                                    Rooms <span class="text-red-300">*</span>

                                </label>

                                <div class="flex items-center justify-between gap-0.5 rounded-md border border-white/20 bg-white/10 p-0.5 sm:gap-1 sm:rounded-lg sm:p-1">

                                    <button
                                        type="button"
                                        id="hotelRoomsMinus"
                                        aria-label="Decrease rooms"
                                        class="flex size-5 shrink-0 items-center justify-center rounded bg-white/10 text-[8px] text-white hover:bg-sky-500 sm:size-8 sm:text-xs"
                                    >
                                        <i class="fa-solid fa-minus"></i>
                                    </button>

                                    <input
                                        type="number"
                                        id="hotelRooms"
                                        name="rooms"
                                        value="1"
                                        min="1"
                                        max="10"
                                        required
                                        readonly
                                        class="w-full min-w-0 bg-transparent text-center text-[9px] font-semibold text-white outline-none sm:text-sm"
                                    >

                                    <button
                                        type="button"
                                        id="hotelRoomsPlus"
                                        aria-label="Increase rooms"
                                        class="flex size-5 shrink-0 items-center justify-center rounded bg-white/10 text-[8px] text-white hover:bg-sky-500 sm:size-8 sm:text-xs"
                                    >
                                        <i class="fa-solid fa-plus"></i>
                                    </button>

                                </div>

                            </div>

                        </div>


                        <!-- SUBMIT BUTTON -->
                        <button
                            type="submit"
                            class="flex w-full items-center justify-center gap-1.5 rounded-md bg-sky-500 px-2 py-2 text-[9px] font-bold text-white shadow-lg shadow-sky-500/20 transition duration-300 hover:bg-sky-600 sm:gap-2 sm:rounded-lg sm:px-4 sm:py-3 sm:text-sm"
                        >

                            <i class="fa-brands fa-whatsapp text-xs sm:text-lg"></i>

                            Send Hotel Enquiry

                            <i class="fa-solid fa-arrow-right text-[8px] sm:text-xs"></i>

                        </button>


                        <!-- PRIVACY TEXT -->
                        <!-- <p class="hidden text-center text-[11px] text-white/60 sm:block">

                            <i class="fa-solid fa-lock mr-1"></i>
                            Your details are safe with us.

                        </p> -->

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     Hotels BOOKING FORM JAVASCRIPT
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const hotelForm = document.getElementById("hotelEnquiryForm");

    if (!hotelForm) return;

    // ==========================================
    // FORM ELEMENTS
    // ==========================================

    const nameInput = document.getElementById("hotelName");
    const mobileInput = document.getElementById("hotelMobile");
    const destinationInput = document.getElementById("hotelDestination");

    const checkInInput = document.getElementById("hotelCheckIn");
    const checkOutInput = document.getElementById("hotelCheckOut");

    const adultsInput = document.getElementById("hotelAdults");
    const childrenInput = document.getElementById("hotelChildren");
    const roomsInput = document.getElementById("hotelRooms");


    // ==========================================
    // LOCAL DATE
    // ==========================================

    function getLocalDate(date = new Date()) {

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;

    }

    const today = getLocalDate();

    checkInInput.min = today;
    checkOutInput.min = today;


    // ==========================================
    // COUNTER FUNCTION
    // ==========================================

    function setupCounter(inputId, minusId, plusId, min, max) {

        const input = document.getElementById(inputId);
        const minus = document.getElementById(minusId);
        const plus = document.getElementById(plusId);

        if (!input || !minus || !plus) return;

        minus.addEventListener("click", function () {

            const value = Number(input.value);

            if (value > min) {
                input.value = value - 1;
            }

        });

        plus.addEventListener("click", function () {

            const value = Number(input.value);

            if (value < max) {
                input.value = value + 1;
            }

        });

    }


    // ==========================================
    // COUNTERS
    // ==========================================

    setupCounter(
        "hotelAdults",
        "hotelAdultsMinus",
        "hotelAdultsPlus",
        1,
        20
    );

    setupCounter(
        "hotelChildren",
        "hotelChildrenMinus",
        "hotelChildrenPlus",
        0,
        20
    );

    setupCounter(
        "hotelRooms",
        "hotelRoomsMinus",
        "hotelRoomsPlus",
        1,
        10
    );


    // ==========================================
    // MOBILE NUMBER INPUT
    // ==========================================

    mobileInput.addEventListener("input", function () {

        this.value = this.value.replace(/\D/g, "").slice(0, 10);

    });


    // ==========================================
    // CHECK-IN DATE
    // ==========================================

    checkInInput.addEventListener("change", function () {

        const checkIn = this.value;

        if (!checkIn) return;

        checkOutInput.min = checkIn;

        if (checkOutInput.value && checkOutInput.value <= checkIn) {

            checkOutInput.value = "";

        }

    });


    // ==========================================
    // CHECK-OUT DATE
    // ==========================================

    checkOutInput.addEventListener("change", function () {

        if (
            checkInInput.value &&
            this.value <= checkInInput.value
        ) {

            alert("Check-out date must be after check-in date.");

            this.value = "";

        }

    });


    // ==========================================
    // DATE FORMAT
    // ==========================================

    function formatDate(dateString) {

        const date = new Date(dateString + "T00:00:00");

        return date.toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });

    }


    // ==========================================
    // FORM SUBMISSION
    // ==========================================

    hotelForm.addEventListener("submit", function (event) {

        event.preventDefault();

        if (!hotelForm.reportValidity()) return;


        // GET VALUES
        const name = nameInput.value.trim();
        const mobile = mobileInput.value.trim();

        const destination = destinationInput.value.trim();

        const checkIn = checkInInput.value;
        const checkOut = checkOutInput.value;

        const adults = Number(adultsInput.value);
        const children = Number(childrenInput.value);
        const rooms = Number(roomsInput.value);


        // NAME VALIDATION
        if (name.length < 2) {

            alert("Please enter your full name.");
            nameInput.focus();
            return;

        }


        // MOBILE VALIDATION
        if (!/^[6-9]\d{9}$/.test(mobile)) {

            alert("Please enter a valid 10-digit mobile number.");
            mobileInput.focus();
            return;

        }


        // DESTINATION VALIDATION
        if (!destination) {

            alert("Please enter your destination or hotel name.");
            destinationInput.focus();
            return;

        }


        // DATE VALIDATION
        if (!checkIn || !checkOut) {

            alert("Please select check-in and check-out dates.");
            return;

        }

        if (checkIn < today) {

            alert("Check-in date cannot be in the past.");
            checkInInput.focus();
            return;

        }

        if (checkOut <= checkIn) {

            alert("Check-out date must be after check-in date.");
            checkOutInput.focus();
            return;

        }


        // COUNTER VALIDATION
        if (
            adults < 1 || adults > 20 ||
            children < 0 || children > 20 ||
            rooms < 1 || rooms > 10
        ) {

            alert("Please check your guest and room details.");
            return;

        }


        // CALCULATE NIGHTS
        const startDate = new Date(checkIn + "T00:00:00");
        const endDate = new Date(checkOut + "T00:00:00");

        const nights = Math.round(
            (endDate - startDate) / (1000 * 60 * 60 * 24)
        );


        // TOTAL GUESTS
        const totalGuests = adults + children;


        // WHATSAPP MESSAGE
        const message = `
*NEW HOTEL BOOKING ENQUIRY*
━━━━━━━━━━━━━━━━━━━━

*PERSONAL DETAILS*

Name: ${name}
Mobile Number: ${mobile}

*HOTEL DETAILS*

Destination / Hotel: ${destination}

Check-in: ${formatDate(checkIn)}
Check-out: ${formatDate(checkOut)}
Total Nights: ${nights}

*GUEST DETAILS*

Adults: ${adults}
Children: ${children}
Total Guests: ${totalGuests}
Rooms Required: ${rooms}

━━━━━━━━━━━━━━━━━━━━

Hello MyTravelSwitch,

I would like to enquire about hotel availability, room options and pricing.

Please contact me with the best available options.

Thank you!
        `.trim();


        // OPEN WHATSAPP
        const whatsappNumber = "918048094245";

        const whatsappURL =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(message);

        window.open(
            whatsappURL,
            "_blank",
            "noopener,noreferrer"
        );

    });

});

</script>




















    <!-- Apna existing page content yahan rakho -->
    <main class="mx-auto max-w-7xl px-4 py-10">
        <h1 class="text-3xl font-bold">mytravelswitch</h1>
    </main>

                <!-- Footer  -->
            <!-- <div id="footer"></div> -->

    <script src="/js/header.js" defer></script>
    <script src="/js/footer.js" defer></script>

</body>
</html>
