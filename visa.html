<body>

<!-- visa HERO SECTION -->

            <!-- LEFT CONTENT -->

                <!-- SMALL DETAIL -->

                <!-- VISA ENQUIRY CTA BUTTONS -->

                    </a>
                
                
                    <!-- DIRECT CALL BUTTON -->

                        <i class="fa-solid fa-phone-volume text-lg text-sky-600 transition-transform duration-300 group-hover:rotate-12"></i>
                
                        <span>+91 8048094245</span>

                    </a>

            </div>



                        <!-- RIGHT SIDE VISA ENQUIRY FORM -->

                        <h3 class="playfair-bold text-[9px] text-white sm:text-lg md:text-2xl">

                        </h3>

                            Share your details to get visa assistance.
                        </p>
                    
                    </div>
                
                
                    <!-- VISA ENQUIRY FORM -->
                    <form
                        id="visaEnquiryForm"
                        class="w-full space-y-1.5 sm:space-y-3"
                        autocomplete="on"
                    >
                
                        <!-- NAME + MOBILE -->
                        <div class="grid grid-cols-2 gap-1.5 sm:gap-3">
                        
                            <!-- NAME -->
                            <div class="min-w-0">
                            
                                <label for="visaName"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">
                                    <i class="fa-solid fa-user mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Full Name <span class="text-red-300">*</span>
                                </label>
                            
                                <input
                                    type="text"
                                    id="visaName"
                                    name="name"
                                    placeholder="Your name"
                                    required
                                    minlength="2"
                                    autocomplete="name"
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1.5 py-1.5 text-[9px] text-white outline-none placeholder:text-white/50 focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >
                            
                            </div>
                        
                        
                            <!-- MOBILE -->
                            <div class="min-w-0">
                            
                                <label for="visaMobile"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">
                                    <i class="fa-solid fa-phone mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Mobile <span class="text-red-300">*</span>
                                </label>
                            
                                <input
                                    type="tel"
                                    id="visaMobile"
                                    name="mobile"
                                    placeholder="10-digit number"
                                    required
                                    inputmode="numeric"
                                    pattern="[6-9][0-9]{9}"
                                    maxlength="10"
                                    minlength="10"
                                    autocomplete="tel-national"
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1.5 py-1.5 text-[9px] text-white outline-none placeholder:text-white/50 focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >
                            
                            </div>
                        
                        </div>
                    
                    
                        <!-- APPLYING FROM + DESTINATION COUNTRY -->
                        <div class="grid grid-cols-2 gap-1.5 sm:gap-3">
                        
                            <!-- APPLYING FROM -->
                            <div class="min-w-0">
                            
                                <label for="visaFrom"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">
                                    <i class="fa-solid fa-location-dot mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Applying From <span class="text-red-300">*</span>
                                </label>
                            
                                <input
                                    type="text"
                                    id="visaFrom"
                                    name="applyingFrom"
                                    placeholder="City / Country"
                                    required
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1.5 py-1.5 text-[9px] text-white outline-none placeholder:text-white/50 focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >
                            
                            </div>
                        
                        
                            <!-- DESTINATION COUNTRY -->
                            <div class="min-w-0">
                            
                                <label for="visaCountry"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">
                                    <i class="fa-solid fa-globe mr-0.5 text-sky-300 sm:mr-1"></i>
                                    Going To <span class="text-red-300">*</span>
                                </label>
                            
                                <input
                                    type="text"
                                    id="visaCountry"
                                    name="destinationCountry"
                                    placeholder="Destination country"
                                    required
                                    class="w-full min-w-0 rounded-md border border-white/20 bg-white/10 px-1.5 py-1.5 text-[9px] text-white outline-none placeholder:text-white/50 focus:border-sky-400 sm:rounded-lg sm:px-3 sm:py-2.5 sm:text-sm"
                                >
                            
                            </div>
                        
                        </div>

                                </label>

                                    name="visaType"
                                    required

                                >
                                    <option value="" selected disabled class="bg-sky-600 text-white">

                                    <option value="Business Visa" class="bg-sky-600 text-white">Business Visa</option>
                                    <option value="Student Visa" class="bg-sky-600 text-white">Student Visa</option>
                                    <option value="Work Visa" class="bg-sky-600 text-white">Work Visa</option>
                                    <option value="Transit Visa" class="bg-sky-600 text-white">Transit Visa</option>

                            <!-- TRAVEL DATE -->

                                <label for="visaTravelDate"
                                    class="mb-0.5 block text-[8px] font-medium text-white sm:mb-1 sm:text-sm">
                                    <i class="fa-solid fa-calendar-days mr-0.5 text-sky-300 sm:mr-1"></i>

                        <!-- SUBMIT BUTTON -->

                        >
                            <i class="fa-brands fa-whatsapp text-xs sm:text-lg"></i>
                            Send Visa Enquiry
                            <i class="fa-solid fa-arrow-right text-[8px] sm:text-xs"></i>
                        </button>
                    
                    </form>
                
                </div>
            
            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     visa BOOKING FORM JAVASCRIPT
========================================================= -->

<script>

/* =========================================================
   MYTRAVELSWITCH - VISA ENQUIRY FORM
   WhatsApp Enquiry Submission
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    const visaForm = document.getElementById("visaEnquiryForm");

    if (!visaForm) return;

    const visaTravelDate = document.getElementById("visaTravelDate");

    // WHATSAPP NUMBER
    const whatsappNumber = "918048094245";


    // GET LOCAL DATE
    function getLocalDate() {

        const today = new Date();

        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;

    }


    // SET MINIMUM TRAVEL DATE
    visaTravelDate.min = getLocalDate();


    // VISA FORM SUBMISSION
    visaForm.addEventListener("submit", function (event) {

        event.preventDefault();

        // FORM VALUES
        const name = document.getElementById("visaName").value.trim();

        const mobile = document.getElementById("visaMobile").value.trim();

        const applyingFrom = document.getElementById("visaFrom").value.trim();

        const destination = document.getElementById("visaCountry").value.trim();

        const visaType = document.getElementById("visaType").value;

        const travelDate = document.getElementById("visaTravelDate").value;

        const passportStatus = document.getElementById("visaPassport").value;


        // BASIC VALIDATION
        if (
            !name ||
            !mobile ||
            !applyingFrom ||
            !destination ||
            !visaType ||
            !travelDate ||
            !passportStatus
        ) {

            alert("Please fill in all required fields.");

            return;

        }


        // NAME VALIDATION
        if (name.length < 2) {

            alert("Please enter your full name.");

            document.getElementById("visaName").focus();

            return;

        }


        // MOBILE VALIDATION
        if (!/^[6-9][0-9]{9}$/.test(mobile)) {

            alert("Please enter a valid 10-digit Indian mobile number.");

            document.getElementById("visaMobile").focus();

            return;

        }


        // DATE VALIDATION
        if (travelDate < getLocalDate()) {

            alert("Please select today or a future travel date.");

            visaTravelDate.focus();

            return;

        }


        // FORMAT DATE
        const formattedDate = new Date(
            travelDate + "T00:00:00"
        ).toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });


        // WHATSAPP MESSAGE
        const message = `
Hello MyTravelSwitch,

I am interested in your Visa Assistance Service.

*VISA ENQUIRY DETAILS*

Name: ${name}
Mobile Number: ${mobile}

Applying From: ${applyingFrom}
Destination Country: ${destination}

Visa Type: ${visaType}
Expected Travel Date: ${formattedDate}

Passport Status: ${passportStatus}

Please assist me with the visa application process, required documents, fees and other details.

Thank you.
        `.trim();


        // OPEN WHATSAPP
        const whatsappURL =
            `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

        window.open(whatsappURL, "_blank", "noopener,noreferrer");

    });

});

</script>
